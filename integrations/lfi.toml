# Canon ↔ LFI long-term integration.
#
# LFI is post-LLM neurosymbolic; Canon is one of its eventual consumer
# corpora. Phased adoption — declared at v0.1 even though only Phase 0
# is operational, so we collect the right data from day one.

[meta]
repo                = "PlausiDen-Canon"
target_repo         = "https://github.com/thepictishbeast/LFI"
phase_current       = "0"

[phases]

[phases.phase_0]
name        = "LLM-assisted suggestion"
status      = "active"
description = """
Claude (via API/MCP) drafts contracts, explains violations, proposes fix codemods.
Cheap unblocker. Deterministic engine remains the gate; AI suggestions never
auto-apply.
"""

[phases.phase_1]
name        = "HDC drift detection"
status      = "planned"
description = """
Encode every component as bipolar HDC vector (D=10000) from features:
AST shape, rendered screenshot hash, prop surface, behavioral signature.
Drift = low cosine similarity vs cluster centroid for component class.
Standalone Rust crate. Feeds audit reports.
"""

[phases.phase_2]
name        = "PSL soft rules"
status      = "planned"
description = """
Soft contracts that resist boolean encoding ("buttons generally use primary
color unless destructive in confirmation context"). CARTA trust weights per
rule source: designer > scraped web convention.
"""

[phases.phase_3]
name        = "Sovereign oracle"
status      = "future"
description = """
LFI ingests full Canon corpus + every violation ledger across every consumer.
Queries like "is this new component consistent with established patterns"
answered locally, not via Anthropic API. Closes the PSA loop on design
decisions.
"""

[data_collection]
# Even in Phase 0, collect the data Phase 1+ will need.
component_corpus      = true
violation_ledger      = true
screenshot_archive    = true
prop_signature_log    = true
